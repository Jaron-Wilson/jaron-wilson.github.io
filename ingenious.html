<meta charset="utf-8">
<title>Ingenious</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ---------- theme tokens ---------- */
:root{
  --bg:#E9EAEF;            /* cool porcelain */
  --surface:#F6F6F9;
  --surface2:#FFFFFF;
  --ink:#232A3B;
  --ink-soft:#5A6377;
  --line:#C9CDDA;
  --cell:#FDFDFF;
  --cell-line:#C4C9D8;
  --cell-dim:#E2E4EC;
  --glow:#2F5FE0;
  --danger:#C43D3D;
  --overlay:rgba(24,28,40,.55);
  --shadow:0 10px 30px rgba(30,36,56,.18);
  --btn-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151D;
    --surface:#1A1F2A;
    --surface2:#222836;
    --ink:#E9EBF4;
    --ink-soft:#9AA3B8;
    --line:#333B4D;
    --cell:#242B3A;
    --cell-line:#3A4359;
    --cell-dim:#1A1F2B;
    --glow:#6E93F2;
    --danger:#E06060;
    --overlay:rgba(6,8,14,.66);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --btn-ink:#0E1118;
  }
}
:root[data-theme="dark"]{
  --bg:#12151D;
  --surface:#1A1F2A;
  --surface2:#222836;
  --ink:#E9EBF4;
  --ink-soft:#9AA3B8;
  --line:#333B4D;
  --cell:#242B3A;
  --cell-line:#3A4359;
  --cell-dim:#1A1F2B;
  --glow:#6E93F2;
  --danger:#E06060;
  --overlay:rgba(6,8,14,.66);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --btn-ink:#0E1118;
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,textarea{font:inherit; color:var(--ink)}
::selection{background:var(--glow); color:var(--surface)}

.serif{font-family:"Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif}
.num{font-variant-numeric:tabular-nums}

#app{height:100%; height:100dvh; display:flex; flex-direction:column; overflow:hidden}
.screen{display:none; flex:1; min-height:0; flex-direction:column}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{align-items:center; justify-content:center; gap:0; padding:24px; overflow-y:auto}
.masthead{text-align:center; margin-bottom:26px}
.masthead .hexrow{display:flex; gap:10px; justify-content:center; margin-bottom:18px}
.masthead h1{
  font-family:"Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  font-weight:400; font-size:clamp(34px, 8vw, 56px);
  letter-spacing:.32em; text-indent:.32em; text-transform:uppercase;
  text-wrap:balance;
}
.masthead p{color:var(--ink-soft); letter-spacing:.14em; text-transform:uppercase; font-size:12px; margin-top:6px}
.mode-cards{display:flex; flex-direction:column; gap:12px; width:min(420px, 100%)}
.mode-card{
  display:flex; align-items:center; gap:14px; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; transition:transform .12s ease, border-color .12s ease;
}
.mode-card:hover{transform:translateY(-1px); border-color:var(--glow)}
.mode-card:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.mode-card .mc-icon{flex:0 0 auto}
.mode-card b{display:block; font-size:17px}
.mode-card span{display:block; color:var(--ink-soft); font-size:13.5px; margin-top:2px}
.mode-card.resume{border-color:var(--glow)}
.home-foot{margin-top:22px; color:var(--ink-soft); font-size:12.5px; text-align:center}
.home-foot button{text-decoration:underline; text-underline-offset:3px}
.home-foot button:hover{color:var(--ink)}

/* ---------- setup ---------- */
#setup{align-items:center; justify-content:flex-start; padding:24px; overflow-y:auto}
.panel{width:min(460px,100%); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:12px}
.panel h2{font-family:"Palatino Linotype", Palatino, Georgia, serif; font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:19px; margin-bottom:16px; text-align:center}
.field{margin-bottom:16px}
.field>label{display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px}
.seg{display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{flex:1; padding:9px 0; color:var(--ink-soft); border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--glow); color:var(--btn-ink); font-weight:600}
.seat{display:flex; gap:8px; align-items:center; margin-bottom:9px}
.seat input[type=text]{
  flex:1; min-width:0; background:var(--surface2); border:1px solid var(--line);
  border-radius:9px; padding:8px 11px;
}
.seat input:focus-visible{outline:2px solid var(--glow); outline-offset:1px}
.seat .seg{flex:0 0 auto; width:150px}
.seat .seg button{padding:8px 0; font-size:13.5px}
.setup-actions{display:flex; gap:10px; margin-top:20px}
.btn{
  flex:1; padding:12px 16px; border-radius:11px; text-align:center; font-weight:600;
  background:var(--surface2); border:1px solid var(--line);
}
.btn:hover{border-color:var(--glow)}
.btn:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.btn.primary{background:var(--glow); border-color:var(--glow); color:var(--btn-ink)}
.btn.quiet{flex:0 0 auto}
.hint{font-size:13px; color:var(--ink-soft); margin-top:10px; text-align:center}

/* ---------- game ---------- */
#game{gap:0}
#gmain{flex:1; min-height:0; min-width:0; display:flex; flex-direction:column}
#gside{display:none}
#topbar{
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  border-bottom:1px solid var(--line); background:var(--surface); flex:0 0 auto;
}
#topbar .title{
  font-family:"Palatino Linotype", Palatino, Georgia, serif;
  letter-spacing:.24em; text-transform:uppercase; font-size:13px; color:var(--ink-soft);
}
#turnline{flex:1; text-align:center; font-size:14.5px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#turnline b{color:var(--glow)}
.iconbtn{
  width:36px; height:36px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--surface2); color:var(--ink-soft); flex:0 0 auto;
}
.iconbtn:hover{color:var(--ink); border-color:var(--glow)}
.iconbtn:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
#bagcount{font-size:12px; color:var(--ink-soft); white-space:nowrap}

#scores{
  display:flex; gap:8px; padding:8px 10px; overflow-x:auto; flex:0 0 auto;
  background:var(--surface); border-bottom:1px solid var(--line); scrollbar-width:thin;
}
.pcard{
  flex:1 0 auto; min-width:148px; border:1px solid var(--line); border-radius:11px;
  padding:6px 9px 7px; background:var(--surface2);
}
.pcard.turn{border-color:var(--glow); box-shadow:0 0 0 1px var(--glow)}
.sortbtn{flex:0 0 auto; align-self:stretch; min-width:30px; padding:4px 7px;
  border:1px solid var(--line); border-radius:9px; background:var(--surface2);
  color:var(--ink-soft); display:grid; place-items:center}
.sortbtn:hover{border-color:var(--glow)}
.sortbtn:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.sortbtn.on{color:var(--btn-ink); background:var(--glow); border-color:var(--glow)}
.pcard .prank{flex:0 0 auto; font-size:11px; font-weight:800; color:var(--glow);
  border:1px solid var(--glow); border-radius:6px; padding:0 4px; line-height:15px}
.pcard .pname{display:flex; align-items:baseline; gap:6px; font-size:13px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pcard .pname .ptag{font-weight:400; color:var(--ink-soft); font-size:11px}
.pcard .pmin{margin-left:auto; font-size:12px; color:var(--ink-soft)}
.pcard .pmin b{font-size:14px; color:var(--ink)}
.tracks{display:flex; gap:4px; margin-top:5px}
.trk{flex:1; text-align:center}
.trk .bar{height:26px; border-radius:5px; background:var(--cell-dim); position:relative; overflow:hidden}
.trk .fill{position:absolute; left:0; right:0; bottom:0; border-radius:4px; transition:height .35s ease}
.trk .val{font-size:10.5px; color:var(--ink-soft); margin-top:2px}
.trk.low .val{color:var(--ink); font-weight:700}
.trk.low .bar{outline:1.5px solid var(--ink-soft); outline-offset:1px}
.trk.maxed .bar{outline:1.5px solid var(--glow); outline-offset:1px}

#boardwrap{flex:1; min-height:0; display:grid; place-items:center; padding:6px; position:relative}
#board{width:100%; height:100%; max-width:900px; touch-action:manipulation}
.cellpoly{fill:var(--cell); stroke:var(--cell-line); stroke-width:.7}
.cell.sel .cellpoly{stroke:var(--glow); stroke-width:1.6}
.cell.hint .cellpoly{fill:var(--cell-dim); stroke:var(--glow); stroke-width:1.1; stroke-dasharray:2.4 1.6}
.cell.hint2 .cellpoly{stroke:var(--glow); stroke-width:1.6; fill:var(--cell-dim)}
.cell:focus{outline:none}
.cell:focus-visible .cellpoly{stroke:var(--glow); stroke-width:2}
.cell.printedc .cellpoly{stroke-width:1.1}
.ghost{opacity:.62}
.flashline{fill:none; stroke-width:2.2; opacity:0; pointer-events:none}
@keyframes flashk{0%{opacity:0} 18%{opacity:.95} 100%{opacity:0}}
.flashline.go{animation:flashk 1.1s ease-out forwards}
@media (prefers-reduced-motion: reduce){
  .flashline.go{animation:none; opacity:.9}
  .mode-card, .trk .fill, .racktile{transition:none}
  .racktile.sel{transform:none}
}

#tray{flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#prompt{font-size:13.5px; color:var(--ink-soft); text-align:center; height:20px; margin-bottom:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#prompt b{color:var(--ink)}
#rackrow{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; min-height:46px}
.racktile{
  border:1.5px solid var(--line); border-radius:10px; padding:4px 6px; background:var(--surface2);
  transition:transform .1s ease, border-color .1s ease; line-height:0;
}
.racktile:hover{border-color:var(--glow)}
.racktile:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.racktile.sel{border-color:var(--glow); box-shadow:0 0 0 1.5px var(--glow); transform:translateY(-3px)}
.racktile:disabled{opacity:.45; cursor:default}
#actionrow{display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; min-height:42px}
#actionrow .btn{flex:0 1 auto; padding:9px 18px; font-size:14.5px}
.gainchips{display:inline-flex; gap:5px; vertical-align:middle}
.gchip{display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:700;
  padding:1px 7px; border-radius:20px; color:#fff}

/* ---------- overlays ---------- */
#overlay{
  position:fixed; inset:0; background:var(--overlay); display:none;
  align-items:center; justify-content:center; padding:20px; z-index:40;
}
#overlay.on{display:flex}
.modal{
  width:min(440px,100%); max-height:88dvh; overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:24px; box-shadow:var(--shadow);
}
.modal h3{font-family:"Palatino Linotype", Palatino, Georgia, serif; font-weight:400;
  letter-spacing:.16em; text-transform:uppercase; font-size:18px; text-align:center; margin-bottom:14px}
.modal p{margin-bottom:12px; color:var(--ink-soft); font-size:14.5px}
.modal p b{color:var(--ink)}
.modal .btnrow{display:flex; gap:10px; margin-top:16px}
.modal textarea{
  width:100%; min-height:86px; background:var(--surface2); border:1px solid var(--line);
  border-radius:10px; padding:10px; font-size:12.5px; word-break:break-all; resize:vertical;
}
.handoff-name{font-size:26px; text-align:center; font-weight:700; margin:10px 0 4px}
.rank{list-style:none; margin:10px 0}
.rank li{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; margin-bottom:6px;
  background:var(--surface2); border:1px solid var(--line)}
.rank li.win{border-color:var(--glow); box-shadow:0 0 0 1px var(--glow)}
.rank .medal{font-weight:700; width:24px; text-align:center; color:var(--ink-soft)}
.rank .rname{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank .rscores{display:flex; gap:3px}
.rscores i{font-style:normal; font-size:11.5px; font-weight:700; color:#fff; border-radius:5px; min-width:20px; text-align:center; padding:2px 2px}
.rules-body h4{margin:14px 0 4px; font-size:14px; letter-spacing:.08em; text-transform:uppercase}
.rules-body p, .rules-body li{font-size:14px; color:var(--ink-soft); margin-bottom:6px}
.rules-body ul{padding-left:18px}
.rules-body b{color:var(--ink)}
.codebox-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px; text-align:center}

@media (min-width: 920px){
  #game{flex-direction:row}
  #gside{flex:0 0 300px; border-left:1px solid var(--line); background:var(--surface);
    display:flex; flex-direction:column; overflow-y:auto}
  #scores{flex-direction:column; border-bottom:none; overflow-x:visible}
  .pcard{min-width:0}
  #tray{border-top:1px solid var(--line)}
}
</style>

<div id="app">

        <div><b>Enter a move code</b><span>continue a play-by-link game a friend sent you</span></div>
      </button>
    </div>
    <div class="home-foot">
      a Reiner Knizia game &middot; <button id="btn-rules-home">how to play</button>
    </div>
  </section>

  <!-- ============ SETUP ============ -->
  <section id="setup" class="screen">
    <div class="panel">
      <h2 id="setup-title">New game</h2>
      <div class="field" id="field-count">
        <label>Players</label>
        <div class="seg" id="seg-count">
          <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
        </div>
      </div>
      <div class="field">
        <label id="seats-label">Seats</label>
        <div id="seats"></div>
      </div>
      <div class="field" id="field-diff" style="display:none">
        <label>AI strength</label>
        <div class="seg" id="seg-diff">
          <button data-d="0">Easy</button><button data-d="1">Standard</button><button data-d="2">Strong</button>
        </div>
      </div>

        <button class="btn primary" id="btn-start">Start game</button>

  <!-- ============ GAME ============ -->
  <section id="game" class="screen">
    <div id="gmain">
      <div id="topbar">
        <button class="iconbtn" id="btn-home" title="Menu" aria-label="Menu">
          <svg width="17" height="17" viewBox="0 0 17 17"><path d="M2 4h13M2 8.5h13M2 13h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="title">Ingenious</span>
        <div id="turnline"></div>
        <span id="bagcount" class="num"></span>
        <button class="iconbtn" id="btn-rules-game" title="How to play" aria-label="How to play">
          <svg width="17" height="17" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.6 6.4c.2-1.1 1-1.8 2-1.8 1.1 0 2 .8 2 1.9 0 1.4-1.9 1.6-1.9 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8.6" cy="12.3" r=".9" fill="currentColor"/></svg>
        </button>

      <div id="boardwrap"><svg id="board" aria-label="game board"></svg></div>
      <div id="tray">
        <div id="prompt"></div>
        <div id="rackrow"></div>
        <div id="actionrow"></div>
      </div>
    </div>
    <div id="gside"><div id="scores"></div></div>
  </section>

</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* =====================================================================
   INGENIOUS — engine + AI + UI, self-contained.
   ===================================================================== */

/* ---------- constants ---------- */
const COLORS = [
  {key:"red",    fill:"#E8484F", dark:"#8F1F26"},
  {key:"orange", fill:"#F07E22", dark:"#8F4710"},
  {key:"yellow", fill:"#F0B429", dark:"#8A6410"},
  {key:"green",  fill:"#3EAE58", dark:"#1E5F30"},
  {key:"blue",   fill:"#3E97ED", dark:"#1A4E85"},
  {key:"purple", fill:"#9A5BD6", dark:"#54287E"},
];
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const SQ3 = Math.sqrt(3);
const CAP = 18, SOLO_CAP = 36;

/* ---------- seeded rng ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- board geometry ---------- */
const ck = (q,r) => q + "," + r;
function regionCells(R){
  const out = [];
  for (let q = -R; q <= R; q++)
    for (let r = Math.max(-R, -q-R); r <= Math.min(R, -q+R); r++)
      out.push([q,r]);
  return out;
}
/* printed start symbols sit at the six corners of the 2-player (radius 4) hexagon */
const START_CORNERS = [[4,-4],[4,0],[0,4],[-4,4],[-4,0],[0,-4]]; // color i at corner i

/* =====================================================================
   ENGINE — strictly action-driven so games replay deterministically.
   Actions: {k:'p', t:tileIdx, a:[q,r], b:[q,r], fa:colorA-first?}  place
            {k:'s', yes:0|1}                                        swap decision
   G.expect: 'place' | 'swap' | 'over'
   ===================================================================== */
function buildBag(rng){
  const bag = [];
  for (let a = 0; a < 6; a++)
    for (let b = a; b < 6; b++){
      const n = (a === b) ? 5 : 6;
      for (let i = 0; i < n; i++) bag.push([a,b]);
    }
  return shuffle(bag, rng); // 120 tiles
}

function newGame(cfg){
  /* cfg: {mode:'local'|'solitaire'|'remote', seed, players:[{type:'human'|'ai', name, diff}], } */
  const solo = cfg.mode === "solitaire";
  const np = solo ? 1 : cfg.players.length;
  const R = solo ? 4 : (np === 2 ? 4 : np === 3 ? 5 : 6);
  const rng = mulberry32(cfg.seed);
  const G = {
    cfg, R, solo, cap: solo ? SOLO_CAP : CAP,
    rng, bag: buildBag(rng),
    cells: regionCells(R),
    board: new Map(),          // key -> {c:color, printed:bool}
    startUsed: [false,false,false,false,false,false],
    players: [], cur: 0,
    pendingBonus: 0,
    expect: "place",
    history: [],
    winnerInstant: -1,
    lastMove: null,            // {a,b,ca,cb, gains, lines} for UI flash
  };
  for (let i = 0; i < 6; i++){
    const [q,r] = START_CORNERS[i];
    G.board.set(ck(q,r), {c:i, printed:true});
  }
  for (let p = 0; p < np; p++){
    const rack = [];
    if (!solo) while (rack.length < 6) rack.push(G.bag.pop());
    G.players.push({rack, scores:[0,0,0,0,0,0], firstDone: false});
  }
  if (solo) G.players[0].rack.push(G.bag.pop()); // solitaire: hand of one tile
  return G;
}

const inRegion = (G,q,r) => Math.abs(q) <= G.R && Math.abs(r) <= G.R && Math.abs(q+r) <= G.R;
const isEmpty  = (G,q,r) => inRegion(G,q,r) && !G.board.has(ck(q,r));

function pairLegal(G, a, b, forPlayer){
  if (!isEmpty(G, a[0], a[1]) || !isEmpty(G, b[0], b[1])) return false;
  const dq = b[0]-a[0], dr = b[1]-a[1];
  if (!DIRS.some(d => d[0] === dq && d[1] === dr)) return false;
  const P = G.players[forPlayer];
  if (!P.firstDone){
    // first tile must touch an unused printed start symbol
    return touchedStarts(G, a, b).some(i => !G.startUsed[i]);
  }
  return true;
}
function touchedStarts(G, a, b){
  const out = [];
  for (let i = 0; i < 6; i++){
    const [sq,sr] = START_CORNERS[i];
    for (const cell of [a,b]){
      if (DIRS.some(d => cell[0]+d[0] === sq && cell[1]+d[1] === sr)){ out.push(i); break; }
    }
  }
  return out;
}

/* score one placed half: 5 rays from `cell`, skipping the ray toward `other`.
   returns {n, cells:[...counted]} */
function rayScore(G, cell, color, other){
  let n = 0; const cells = [];
  for (const d of DIRS){
    if (cell[0]+d[0] === other[0] && cell[1]+d[1] === other[1]) continue;
    let q = cell[0]+d[0], r = cell[1]+d[1];
    while (inRegion(G,q,r)){
      const occ = G.board.get(ck(q,r));
      if (!occ || occ.c !== color) break;
      n++; cells.push([q,r]);
      q += d[0]; r += d[1];
    }
  }
  return {n, cells};
}

/* compute gains without mutating; board must NOT yet contain a,b */
function previewGains(G, a, b, ca, cb){
  G.board.set(ck(a[0],a[1]), {c:ca});
  G.board.set(ck(b[0],b[1]), {c:cb});
  const ra = rayScore(G, a, ca, b), rb = rayScore(G, b, cb, a);
  G.board.delete(ck(a[0],a[1])); G.board.delete(ck(b[0],b[1]));
  const gains = [0,0,0,0,0,0];
  gains[ca] += ra.n; gains[cb] += rb.n;
  return {gains, la: ra.cells, lb: rb.cells};
}

function anyPairExists(G){
  for (const [q,r] of G.cells){
    if (!isEmpty(G,q,r)) continue;
    for (let i = 0; i < 3; i++){ // 3 canonical dirs cover all pairs
      const d = DIRS[i];
      if (isEmpty(G, q+d[0], r+d[1])) return true;
    }
  }
  return false;
}
function playerHasMove(G, p){
  if (!G.players[p].rack.length) return false;
  if (G.players[p].firstDone) return anyPairExists(G);
  // first move: need a pair touching an unused start
  for (const [q,r] of G.cells){
    if (!isEmpty(G,q,r)) continue;
    for (const d of DIRS){
      const b = [q+d[0], r+d[1]];
      if (isEmpty(G,b[0],b[1]) && pairLegal(G,[q,r],b,p)) return true;
    }
  }
  return false;
}

function swapEligible(G, p){
  if (G.solo) return false;
  const P = G.players[p];
  const mn = Math.min(...P.scores);
  const lows = new Set(P.scores.map((s,i)=>[s,i]).filter(x=>x[0]===mn).map(x=>x[1]));
  return !P.rack.some(t => lows.has(t[0]) || lows.has(t[1]));
}

function drawUp(G, P, n){
  while (P.rack.length < n && G.bag.length) P.rack.push(G.bag.pop());
}

/* apply an action; returns an event object for the UI */
function applyAction(G, act){
  if (G.expect === "over") throw new Error("game over");
  const P = G.players[G.cur];

  if (act.k === "s"){
    if (G.expect !== "swap") throw new Error("unexpected swap");
    G.history.push(act);
    if (act.yes){
      const old = P.rack.splice(0, P.rack.length);
      drawUp(G, P, 6);
      G.bag.push(...old);
      shuffle(G.bag, G.rng);
    }
    endTurn(G);
    return {type:"swap", yes:!!act.yes};
  }

  // place
  if (G.expect !== "place") throw new Error("unexpected place");
  const tile = P.rack[act.t];
  if (!tile) throw new Error("bad tile index");
  const [a, b] = [act.a, act.b];
  if (!pairLegal(G, a, b, G.cur)) throw new Error("illegal placement");
  G.history.push(act);
  const ca = act.fa ? tile[0] : tile[1];
  const cb = act.fa ? tile[1] : tile[0];

  const pv = previewGains(G, a, b, ca, cb);
  G.board.set(ck(a[0],a[1]), {c:ca});
  G.board.set(ck(b[0],b[1]), {c:cb});
  if (!P.firstDone){
    touchedStarts(G, a, b).forEach(i => G.startUsed[i] = true);
    P.firstDone = true;
  }
  P.rack.splice(act.t, 1);

  let newlyMaxed = 0;
  for (let c = 0; c < 6; c++){
    if (!pv.gains[c]) continue;
    const before = P.scores[c];
    P.scores[c] = Math.min(G.cap, before + pv.gains[c]);
    if (!G.solo && before < CAP && P.scores[c] === CAP) newlyMaxed++;
  }
  G.lastMove = {a, b, ca, cb, gains: pv.gains, la: pv.la, lb: pv.lb, player: G.cur};

  // instant win: all six tracks maxed
  if (!G.solo && P.scores.every(s => s === CAP)){
    G.expect = "over"; G.winnerInstant = G.cur;
    return {type:"place", instantWin:true, bonus:0};
  }

  if (!G.solo) G.pendingBonus += newlyMaxed;

  if (G.solo){
    drawUp(G, P, 1);
    if (!anyPairExists(G) || !P.rack.length) G.expect = "over";
    return {type:"place", bonus:0};
  }

  if (G.pendingBonus > 0 && P.rack.length && anyPairExists(G)){
    G.pendingBonus--;               // owe one more placement this turn
    return {type:"place", bonus:newlyMaxed, more:true};
  }
  G.pendingBonus = 0;

  if (swapEligible(G, G.cur)){
    G.expect = "swap";
    return {type:"place", bonus:newlyMaxed, askSwap:true};
  }
  endTurn(G);
  return {type:"place", bonus:newlyMaxed};
}

function endTurn(G){
  const P = G.players[G.cur];
  drawUp(G, P, 6);
  if (!anyPairExists(G)){ G.expect = "over"; return; }
  G.cur = (G.cur + 1) % G.players.length;
  G.expect = "place";
  // a player who somehow cannot move (empty rack w/ empty bag) ends the game
  if (!playerHasMove(G, G.cur)) G.expect = "over";
}

/* final ranking: sort each player's scores ascending, compare lexicographically */
function scoreVec(P){ return [...P.scores].sort((x,y)=>x-y); }
function cmpPlayers(A, B){
  const a = scoreVec(A), b = scoreVec(B);
  for (let i = 0; i < 6; i++) if (a[i] !== b[i]) return b[i] - a[i];
  return 0;
}
function finalRanking(G){
  if (G.winnerInstant >= 0){
    const rest = G.players.map((_,i)=>i).filter(i=>i!==G.winnerInstant)
      .sort((x,y)=>cmpPlayers(G.players[x], G.players[y]));
    return [G.winnerInstant, ...rest];
  }
  return G.players.map((_,i)=>i).sort((x,y)=>cmpPlayers(G.players[x], G.players[y]));
}

/* enumerate legal placements for a player (as actions) */
function allPlacements(G, p){
  const out = [];
  const P = G.players[p];
  const pairs = [];
  for (const [q,r] of G.cells){
    if (!isEmpty(G,q,r)) continue;
    for (let i = 0; i < 3; i++){
      const d = DIRS[i], b = [q+d[0], r+d[1]];
      if (isEmpty(G,b[0],b[1]) && pairLegal(G,[q,r],b,p)) pairs.push([[q,r],b]);
    }
  }
  const seen = new Set();
  P.rack.forEach((tile, t) => {
    const sig = tile[0]+"-"+tile[1];
    if (seen.has(sig)) return; // identical tiles: skip duplicates
    seen.add(sig);
    for (const [a,b] of pairs){
      out.push({k:"p", t, a, b, fa:1});
      if (tile[0] !== tile[1]) out.push({k:"p", t, a, b, fa:0});
    }
  });
  return out;
}
/* =====================================================================
   AI — maximize the weakest colors; the game scores your minimum track.
   diff 0 easy: mostly greedy on raw points, noisy.
   diff 1 standard: rank-weighted gains + bonus awareness.
   diff 2 strong: standard + penalize juicy lines left open for the next player.
   ===================================================================== */
function rankWeights(scores){
  // weight each color by how low it currently is (low rank = heavy)
  const order = scores.map((s,i)=>[s,i]).sort((x,y)=>x[0]-y[0]);
  const w = [0,0,0,0,0,0];
  const table = [34, 21, 13, 8, 5, 3];
  order.forEach(([_,c], rank) => w[c] = table[rank]);
  return w;
}
function evalMove(G, p, act){
  const P = G.players[p];
  const tile = P.rack[act.t];
  const ca = act.fa ? tile[0] : tile[1];
  const cb = act.fa ? tile[1] : tile[0];
  const pv = previewGains(G, act.a, act.b, ca, cb);
  const w = rankWeights(P.scores);
  let v = 0, maxed = 0;
  for (let c = 0; c < 6; c++){
    if (!pv.gains[c]) continue;
    const eff = Math.min(G.cap, P.scores[c] + pv.gains[c]) - P.scores[c]; // capped gain
    v += eff * w[c];
    if (!G.solo && P.scores[c] < CAP && P.scores[c] + pv.gains[c] >= CAP) maxed++;
    // wasted overflow slightly discouraged
    v -= (pv.gains[c] - eff) * 2;
  }
  v += maxed * 260; // an extra placement is huge
  return {v, gains: pv.gains};
}
/* how many points the best single ray from each empty cell could give, per color */
function threatAfter(G, act, nextP){
  const P = G.players[nextP];
  const tile = G.players[G.cur].rack[act.t];
  const ca = act.fa ? tile[0] : tile[1];
  const cb = act.fa ? tile[1] : tile[0];
  G.board.set(ck(act.a[0],act.a[1]), {c:ca});
  G.board.set(ck(act.b[0],act.b[1]), {c:cb});
  const w = rankWeights(P.scores);
  let best = 0;
  for (const [q,r] of G.cells){
    if (!isEmpty(G,q,r)) continue;
    // best color score achievable from this cell (upper bound on half-a-tile)
    for (let c = 0; c < 6; c++){
      const rs = rayScore(G, [q,r], c, [999,999]);
      const eff = Math.min(G.cap, P.scores[c] + rs.n) - P.scores[c];
      const val = eff * w[c];
      if (val > best) best = val;
    }
  }
  G.board.delete(ck(act.a[0],act.a[1]));
  G.board.delete(ck(act.b[0],act.b[1]));
  return best;
}
function aiChoose(G, p, diff, rng){
  const acts = allPlacements(G, p);
  if (!acts.length) return null;
  const noise = diff === 0 ? 26 : diff === 1 ? 5 : 2.5;
  let scored = acts.map(a => {
    let v;
    if (diff === 0){
      const P = G.players[p];
      const tile = P.rack[a.t];
      const ca = a.fa ? tile[0] : tile[1], cb = a.fa ? tile[1] : tile[0];
      const pv = previewGains(G, a.a, a.b, ca, cb);
      v = pv.gains.reduce((s,x)=>s+x, 0) * 10;
    } else {
      v = evalMove(G, p, a).v;
    }
    return {a, v: v + rng() * noise * 10};
  });
  scored.sort((x,y)=>y.v - x.v);
  if (diff === 2 && G.players.length > 1){
    const nextP = (p + 1) % G.players.length;
    const top = scored.slice(0, 10);
    for (const s of top) s.v -= 0.55 * threatAfter(G, s.a, nextP);
    top.sort((x,y)=>y.v - x.v);
    return top[0].a;
  }
  return scored[0].a;
}
/* =====================================================================
   SVG board rendering
   ===================================================================== */
const S = 10; // hex radius in svg units
function pos(q,r){ return [S*SQ3*(q + r/2), S*1.5*r]; }
function hexPts(cx, cy, rad){
  const pts = [];
  for (let k = 0; k < 6; k++){
    const a = Math.PI/180 * (60*k - 90);
    pts.push((cx + rad*Math.cos(a)).toFixed(2) + "," + (cy + rad*Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}
function el(n, attrs, parent){
  const e = document.createElementNS("http://www.w3.org/2000/svg", n);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function starPts(cx, cy, rOut, rIn, n, rot){
  const pts = [];
  for (let k = 0; k < n*2; k++){
    const rad = k % 2 === 0 ? rOut : rIn;
    const a = Math.PI * k / n + (rot || 0);
    pts.push((cx + rad*Math.sin(a)).toFixed(2) + "," + (cy - rad*Math.cos(a)).toFixed(2));
  }
  return pts.join(" ");
}
/* one distinct shape per color (colorblind-friendly) */
function symbolDefs(defs){
  const mk = i => { const g = el("g", {id:"sym"+i}); defs.appendChild(g); return g; };
  let g;
  g = mk(0); // red: solid circle
  el("circle", {cx:0, cy:0, r:5.2, fill:COLORS[0].fill, stroke:COLORS[0].dark, "stroke-width":.8}, g);
  g = mk(1); // orange: six-petal flower
  for (let k = 0; k < 6; k++){
    const a = Math.PI/3*k;
    el("circle", {cx:(3.6*Math.sin(a)).toFixed(2), cy:(-3.6*Math.cos(a)).toFixed(2), r:2.3, fill:COLORS[1].fill}, g);
  }
  el("circle", {cx:0, cy:0, r:2.3, fill:COLORS[1].fill, stroke:COLORS[1].dark, "stroke-width":.6}, g);
  g = mk(2); // yellow: six-point star
  el("polygon", {points:starPts(0,0,6.3,3.1,6,0), fill:COLORS[2].fill, stroke:COLORS[2].dark, "stroke-width":.8, "stroke-linejoin":"round"}, g);
  g = mk(3); // green: hexagon (rotated 30° vs the cell)
  el("polygon", {points:[0,1,2,3,4,5].map(k=>{
      const a = Math.PI/3*k + Math.PI/6;
      return (5.3*Math.sin(a)).toFixed(2) + "," + (-5.3*Math.cos(a)).toFixed(2);
    }).join(" "), fill:COLORS[3].fill, stroke:COLORS[3].dark, "stroke-width":.8, "stroke-linejoin":"round"}, g);
  g = mk(4); // blue: ring
  el("circle", {cx:0, cy:0, r:4.4, fill:"none", stroke:COLORS[4].fill, "stroke-width":2.6}, g);
  el("circle", {cx:0, cy:0, r:5.8, fill:"none", stroke:COLORS[4].dark, "stroke-width":.7}, g);
  g = mk(5); // purple: four-point spark
  el("polygon", {points:starPts(0,0,6.4,2.2,4,Math.PI/4), fill:COLORS[5].fill, stroke:COLORS[5].dark, "stroke-width":.8, "stroke-linejoin":"round"}, g);
}
function useSym(color, x, y, parent, scale){
  return el("use", {href:"#sym"+color, transform:`translate(${x.toFixed(2)} ${y.toFixed(2)})` + (scale ? ` scale(${scale})` : "")}, parent);
}

const boardSvg = document.getElementById("board");
const cellEls = new Map();
let ghostLayer = null, flashLayer = null;

function buildBoard(G){
  boardSvg.innerHTML = "";
  cellEls.clear();
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  const gridLayer = el("g", {}, boardSvg);
  for (const [q,r] of G.cells){
    const [x,y] = pos(q,r);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    const g = el("g", {"class":"cell", "data-q":q, "data-r":r}, gridLayer);
    el("polygon", {points:hexPts(x, y, S*0.94), "class":"cellpoly"}, g);
    cellEls.set(ck(q,r), {g, x, y});
  }
  ghostLayer = el("g", {"pointer-events":"none"}, boardSvg);
  flashLayer = el("g", {"pointer-events":"none"}, boardSvg);
  const m = S*1.6;
  boardSvg.setAttribute("viewBox", `${(minX-m).toFixed(1)} ${(minY-m).toFixed(1)} ${(maxX-minX+2*m).toFixed(1)} ${(maxY-minY+2*m).toFixed(1)}`);
  gridLayer.addEventListener("click", ev => {
    const c = ev.target.closest(".cell");
    if (c) onCellTap(+c.dataset.q, +c.dataset.r);
  });
  gridLayer.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const c = ev.target.closest(".cell");
    if (c){ ev.preventDefault(); onCellTap(+c.dataset.q, +c.dataset.r); }
  });
}

function renderCells(G){
  for (const [q,r] of G.cells){
    const key = ck(q,r);
    const {g, x, y} = cellEls.get(key);
    // wipe everything but the base polygon
    while (g.childNodes.length > 1) g.removeChild(g.lastChild);
    g.classList.remove("hint","hint2","sel","printedc");
    const occ = G.board.get(key);
    if (occ){
      if (occ.printed){
        g.classList.add("printedc");
        el("circle", {cx:x, cy:y, r:7.6, fill:"none", stroke:COLORS[occ.c].fill,
          "stroke-width":.9, "stroke-dasharray":"1.8 1.6",
          opacity: G.startUsed[occ.c] && !allFirstDone(G) ? .35 : .8}, g);
        useSym(occ.c, x, y, g, .82);
      } else {
        useSym(occ.c, x, y, g);
      }
    }
  }
}
function allFirstDone(G){ return G.players.every(p => p.firstDone); }

function markLastMove(G){
  if (!G.lastMove) return;
  for (const cell of [G.lastMove.a, G.lastMove.b]){
    const e = cellEls.get(ck(cell[0],cell[1]));
    if (e) e.g.classList.add("sel");
  }
}
function flashScoredLines(G){
  flashLayer.innerHTML = "";
  const lm = G.lastMove;
  if (!lm) return;
  const draw = (cells, color) => {
    for (const [q,r] of cells){
      const e = cellEls.get(ck(q,r));
      if (!e) continue;
      const p = el("polygon", {points:hexPts(e.x, e.y, S*0.94), "class":"flashline", stroke:COLORS[color].fill}, flashLayer);
      requestAnimationFrame(()=>p.classList.add("go"));
    }
  };
  draw(lm.la, lm.ca);
  draw(lm.lb, lm.cb);
  setTimeout(()=>{ if (flashLayer) flashLayer.innerHTML = ""; }, 1300);
}
function drawGhost(G, a, b, ca, cb){
  ghostLayer.innerHTML = "";
  for (const [cell, col] of [[a,ca],[b,cb]]){
    const e = cellEls.get(ck(cell[0],cell[1]));
    if (!e) continue;
    const g = el("g", {"class":"ghost"}, ghostLayer);
    el("polygon", {points:hexPts(e.x, e.y, S*0.94), fill:"var(--cell-dim)", stroke:"var(--glow)", "stroke-width":1.4}, g);
    useSym(col, e.x, e.y, g);
  }
}

   App state + rendering

  sel:{t:null, anchor:null, second:null, fa:1},

}
function pName(i){

}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function renderScores(){
  const G = App.G, box = $("scores");
  box.innerHTML = "";
  const multi = !G.solo && G.players.length > 1;
  if (multi){
    const sb = document.createElement("button");
    sb.className = "sortbtn" + (App.sortScores ? " on" : "");
    sb.title = App.sortScores ? "Standings — tap for seat order" : "Sort by standing";
    sb.setAttribute("aria-pressed", String(!!App.sortScores));
    sb.setAttribute("aria-label", "sort players by standing");
    sb.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h10M2 7h7M2 11h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    sb.addEventListener("click", ()=>{
      App.sortScores = !App.sortScores;
      try{ localStorage.setItem("ing.sort", App.sortScores ? "1" : "0"); }catch(e){}
      renderScores();
    });
    box.appendChild(sb);
  }
  let order = G.players.map((_, i) => i);
  let ranks = null;
  if (multi && App.sortScores){
    order.sort((x, y) => cmpPlayers(G.players[x], G.players[y]) || x - y);
    ranks = order.map((pi, i) =>
      i > 0 && cmpPlayers(G.players[order[i]], G.players[order[i-1]]) === 0 ? null : i + 1);
    for (let i = 1; i < ranks.length; i++) if (ranks[i] === null) ranks[i] = ranks[i-1];
  }
  order.forEach((i, idx) => {
    const P = G.players[i];
    const mn = Math.min(...P.scores);
    const card = document.createElement("div");
    card.className = "pcard" + (i === G.cur && G.expect !== "over" ? " turn" : "");
    let rank = "";
    if (ranks){
      const sharedRank = ranks.filter(r => r === ranks[idx]).length > 1;
      rank = `<span class="prank num">${sharedRank ? "=" : ""}${ranks[idx]}</span>`;
    }
    const tag = G.cfg.players[i].type === "ai" ? `<span class="ptag">AI</span>` : "";
    let tracks = "";
    for (let c = 0; c < 6; c++){
      const pct = Math.round(100 * P.scores[c] / G.cap);
      const low = P.scores[c] === mn ? " low" : "";
      const maxed = !G.solo && P.scores[c] === CAP ? " maxed" : "";
      tracks += `<div class="trk${low}${maxed}">
        <div class="bar" style="border:1.5px solid ${COLORS[c].fill}"><div class="fill" style="height:${pct}%;background:${COLORS[c].fill}"></div></div>
        <div class="val num">${P.scores[c]}</div></div>`;
    }
    card.innerHTML = `<div class="pname">${rank}<span>${pName(i)}</span>${tag}
      <span class="pmin">score <b class="num">${mn}</b></span></div>
      <div class="tracks">${tracks}</div>`;
    box.appendChild(card);
  });
}

function tileSvg(tile, rad){
  const r = rad || 12;
  const dx = SQ3 * r, w = dx + 2*r + 6, h = 2*r + 4;
  const c1 = [r + 3, h/2], c2 = [r + 3 + dx, h/2];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="${hexPts(c1[0], c1[1], r*0.96)}" fill="var(--cell)" stroke="var(--cell-line)"/>
    <polygon points="${hexPts(c2[0], c2[1], r*0.96)}" fill="var(--cell)" stroke="var(--cell-line)"/>
    <g transform="translate(${c1[0]} ${c1[1]}) scale(${r/10})"><use href="#sym${tile[0]}"/></g>
    <g transform="translate(${c2[0]} ${c2[1]}) scale(${r/10})"><use href="#sym${tile[1]}"/></g>
  </svg>`;
}

function humanCanAct(){
  const G = App.G;
  if (!G || G.expect === "over") return false;
  if (G.cfg.players[G.cur].type === "ai") return false;
  if (App.mode === "remote" && G.cur !== App.mySeat) return false;
  return true;
}

function countEmpty(G){ let n=0; for (const [q,r] of G.cells) if (!G.board.has(ck(q,r))) n++; return n; }

function clearSelection(keepTile){
  if (!keepTile) App.sel.t = null;
  App.sel.anchor = null; App.sel.second = null; App.sel.fa = 1;
  if (ghostLayer) ghostLayer.innerHTML = "";
}

function computeAnchors(){
  const G = App.G;
  const set = new Set();
  for (const [q,r] of G.cells){
    if (!isEmpty(G,q,r)) continue;
    for (const d of DIRS){
      const b = [q+d[0], r+d[1]];
      if (isEmpty(G,b[0],b[1]) && pairLegal(G,[q,r],b,G.cur)){ set.add(ck(q,r)); break; }
    }
  }
  return set;
}

function setHint(g, cls){
  g.classList.add(cls);
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
}
function renderHints(){
  const G = App.G;
  for (const [,e] of cellEls){
    e.g.classList.remove("hint","hint2");
    e.g.removeAttribute("tabindex");
    e.g.removeAttribute("role");
  }
  if (!humanCanAct() || G.expect !== "place" || App.sel.t === null) return;
  if (App.sel.anchor && App.sel.second) return; // pending: no hints
  if (!App.sel.anchor){
    if (!App.anchors) App.anchors = computeAnchors();
    for (const k of App.anchors) setHint(cellEls.get(k).g, "hint");
  } else {
    const a = App.sel.anchor;
    setHint(cellEls.get(ck(a[0],a[1])).g, "hint2");
    for (const d of DIRS){
      const b = [a[0]+d[0], a[1]+d[1]];
      if (isEmpty(G,b[0],b[1]) && pairLegal(G, a, b, G.cur))
        setHint(cellEls.get(ck(b[0],b[1])).g, "hint");
    }
  }
}

function renderPrompt(){

  }
  if (!humanCanAct()){
    if (App.mode === "remote" && G.cur !== App.mySeat){
      pr.innerHTML = `waiting for <b>${pName(G.cur)}</b>&hellip;`;
      ar.innerHTML = `<button class="btn" id="act-code">Move code</button>
        <button class="btn primary" id="act-reply">Enter reply</button>`;
      $("act-code").addEventListener("click", ()=>showSendModal(false));
      $("act-reply").addEventListener("click", showJoinModal);
    } else {
      pr.innerHTML = G.cfg.players[G.cur].type === "ai" ? `${pName(G.cur)} is thinking&hellip;` : "";
    }
    return;
  }
  const bonusNote = App.bonusActive ? `<b>Ingenious!</b> Play a bonus tile &mdash; ` : "";
  if (G.expect === "swap"){ pr.innerHTML = ""; return; }
  const s = App.sel;
  if (s.t === null){
    pr.innerHTML = bonusNote + (G.solo ? "Place your tile: tap it below, then the board." : "Tap a tile in your rack.");
  } else if (!s.anchor){
    pr.innerHTML = bonusNote + (allFirstDone(G) || G.players[G.cur].firstDone
      ? "Tap a highlighted cell for the tile&rsquo;s first half."
      : "First tile: it must touch an unused <b>start symbol</b>. Tap a highlighted cell.");
  } else if (!s.second){
    pr.innerHTML = "Now tap a neighbouring cell for the other half.";
    ar.innerHTML = `<button class="btn quiet" id="act-cancel">Cancel</button>`;
    $("act-cancel").addEventListener("click", ()=>{ clearSelection(true); refreshBoardUI(); });
  } else {
    const P = G.players[G.cur], tile = P.rack[s.t];
    const ca = s.fa ? tile[0] : tile[1], cb = s.fa ? tile[1] : tile[0];
    const pv = previewGains(G, s.anchor, s.second, ca, cb);
    const chips = pv.gains.map((g,c)=> g ? chip(c, "+"+g) : "").join("") || `<span style="opacity:.7">no points</span>`;
    pr.innerHTML = `scores <span class="gainchips">${chips}</span>`;
    const flipBtn = tile[0] !== tile[1] ? `<button class="btn" id="act-flip">&#8646; Flip</button>` : "";
    ar.innerHTML = `<button class="btn quiet" id="act-cancel">Cancel</button>${flipBtn}
      <button class="btn primary" id="act-confirm">Place tile</button>`;
    $("act-cancel").addEventListener("click", ()=>{ clearSelection(true); refreshBoardUI(); });
    if (tile[0] !== tile[1]) $("act-flip").addEventListener("click", ()=>{
      App.sel.fa ^= 1; refreshBoardUI();
    });
    $("act-confirm").addEventListener("click", ()=>{
      doAction({k:"p", t:s.t, a:s.anchor, b:s.second, fa:s.fa});

function refreshBoardUI(){
  const G = App.G;
  renderCells(G);
  markLastMove(G);
  renderHints();
  const s = App.sel;
  if (s.t !== null && s.anchor && s.second){
    const tile = G.players[G.cur].rack[s.t];
    const ca = s.fa ? tile[0] : tile[1], cb = s.fa ? tile[1] : tile[0];
    drawGhost(G, s.anchor, s.second, ca, cb);
  } else if (ghostLayer) ghostLayer.innerHTML = "";
  renderRack();
  renderScores();
  renderTurnline();
  renderPrompt();
}

/* ---------- interaction ---------- */
function onTileTap(t){
  if (!humanCanAct() || App.G.expect !== "place") return;
  if (App.sel.t === t && !App.sel.anchor){ clearSelection(); }
  else { const keepAnchor = false; App.sel.t = t; App.sel.anchor = null; App.sel.second = null; App.sel.fa = 1; }
  refreshBoardUI();
}
function onCellTap(q, r){
  const G = App.G;
  if (!humanCanAct() || G.expect !== "place" || App.sel.t === null) return;
  const s = App.sel;
  if (!App.anchors) App.anchors = computeAnchors();
  const isAnchor = App.anchors.has(ck(q,r));
  if (!s.anchor){
    if (isAnchor){ s.anchor = [q,r]; refreshBoardUI(); }
    return;
  }
  if (!s.second){
    const b = [q,r];
    if (pairLegal(G, s.anchor, b, G.cur)){ s.second = b; refreshBoardUI(); return; }
    if (isAnchor && ck(q,r) !== ck(s.anchor[0],s.anchor[1])){ s.anchor = [q,r]; refreshBoardUI(); return; }
    s.anchor = null; refreshBoardUI();
    return;
  }
  // pending exists: tap elsewhere = restart from that cell if valid anchor
  if (isAnchor){ s.anchor = [q,r]; s.second = null; s.fa = 1; refreshBoardUI(); }
}
/* =====================================================================
   Turn driver
   ===================================================================== */
function humansCount(){ return App.G ? App.G.cfg.players.filter(p=>p.type==="human").length : 0; }

function doAction(act){
  const G = App.G;
  let ev;
  try { ev = applyAction(G, act); }
  catch(e){ console.error(e); clearSelection(); refreshBoardUI(); return; }
  clearSelection();
  App.anchors = null;
  App.bonusActive = !!(ev && ev.more);
  persist();
  refreshBoardUI();
  if (act.k === "p") flashScoredLines(G);
  pump();
}

function pump(){
  const G = App.G;
  if (!G) return;
  const gen = App.gen;
  if (G.expect === "over"){
    App.modalTimer = setTimeout(()=>{ if (App.gen !== gen) return;
      App.mode === "remote" ? showSendModal(true) : showGameOver();
    }, App.G.lastMove ? 900 : 0);
    return;
  }
  if (App.mode === "remote" && G.cur !== App.mySeat){
    App.modalTimer = setTimeout(()=>{ if (App.gen === gen) showSendModal(false); }, 900);
    return;
  }
  const seat = G.cfg.players[G.cur];
  if (seat.type === "ai"){
    setTimeout(()=>{ if (App.gen !== gen || !App.G) return; aiStep(); }, 750);
    return;
  }
  if (App.mode === "local" && humansCount() > 1 && App.revealedFor !== G.cur &&
      (G.expect === "place" || G.expect === "swap") && !App.bonusActive){
    showHandoff();
    return;
  }
  if (G.expect === "swap"){ showSwapModal(); return; }
}

function aiStep(){
  const G = App.G;
  if (!G || G.expect === "over") return;
  if (G.expect === "swap"){ doAction({k:"s", yes:1}); return; }
  const mv = aiChoose(G, G.cur, G.cfg.players[G.cur].diff ?? 1, Math.random);
  if (!mv){ G.expect = "over"; persist(); refreshBoardUI(); pump(); return; }
  doAction(mv);
}

    <div class="btnrow">

function scoreChips(P){
  return [...P.scores].map((s,c)=>[s,c]).sort((x,y)=>x[0]-y[0])
    .map(([s,c])=>`<i style="background:${COLORS[c].dark}">${s}</i>`).join("");
}
function showGameOver(){
  const G = App.G;
  if (G.solo){
    const final = Math.min(...G.players[0].scores);
    const bk = "ing.best.solo";
    const prev = +(localStorage.getItem(bk) || 0);
    const isBest = final > prev;
    if (isBest) try{ localStorage.setItem(bk, final); }catch(e){}
    showModal(`<h3>Solitaire complete</h3>
      <p style="text-align:center;font-size:15px">Your weakest color finished at</p>
      <div class="handoff-name num">${final} / 36</div>
      <ul class="rank"><li><span class="rname">Colors</span><span class="rscores">${scoreChips(G.players[0])}</span></li></ul>
      <p style="text-align:center">${isBest ? "&#127942; New personal best!" : "Personal best: <b>" + Math.max(prev, final) + "</b>"}</p>
      <div class="btnrow">
        <button class="btn" id="m-menu">Menu</button>
        <button class="btn" id="m-view">View board</button>
        <button class="btn primary" id="m-again">Play again</button></div>`);
  } else {
    const order = finalRanking(G);
    // shared ranks: players with identical sorted score vectors are genuinely tied
    let ranks;
    if (G.winnerInstant >= 0) ranks = order.map((_, i) => i + 1);
    else {
      ranks = order.map((pi, i) =>
        i > 0 && cmpPlayers(G.players[order[i]], G.players[order[i-1]]) === 0 ? null : i + 1);
      for (let i = 1; i < ranks.length; i++) if (ranks[i] === null) ranks[i] = ranks[i-1];
    }
    const shared = r => ranks.filter(x => x === r).length > 1;
    const tiedFirst = G.winnerInstant < 0 && shared(1);
    const rows = order.map((pi, i) => `
      <li class="${ranks[i] === 1 ? "win" : ""}">
        <span class="medal num">${shared(ranks[i]) ? "=" + ranks[i] : ranks[i]}</span>
        <span class="rname">${pName(pi)}</span>
        <span class="rscores">${scoreChips(G.players[pi])}</span>
      </li>`).join("");
    const leaders = order.filter((_, i) => ranks[i] === 1).map(pi => pName(pi));
    const leaderList = leaders.length > 2
      ? leaders.slice(0, -1).join(", ") + " &amp; " + leaders[leaders.length - 1]
      : leaders.join(" &amp; ");
    const headline = G.winnerInstant >= 0
      ? `${pName(G.winnerInstant)} maxed all six colors &mdash; instant win!`
      : tiedFirst ? `${leaderList} tie for the win &mdash; every color deadlocked.`
      : `${pName(order[0])} wins &mdash; strongest weakest color.`;
    const remoteNote = App.mode === "remote"
      ? `<p style="text-align:center;font-size:12.5px"><b>Rematch:</b> one of you taps it and sends the first move &mdash; the other just waits for the code.</p>` : "";
    showModal(`<h3>Game over</h3>
      <p style="text-align:center">${headline}</p>
      <ul class="rank">${rows}</ul>
      <p style="text-align:center;font-size:12.5px">scores are each player&rsquo;s six colors, weakest first &mdash; compared left to right</p>
      ${remoteNote}
      <div class="btnrow">
        <button class="btn" id="m-menu">Menu</button>
        <button class="btn" id="m-view">View board</button>
        <button class="btn primary" id="m-again">Rematch</button></div>`);
  }
  $("m-menu").addEventListener("click", ()=>{ clearSave(); hideModal(); goHome(); });
  $("m-view").addEventListener("click", hideModal);
  $("m-again").addEventListener("click", ()=>{
    const base = App.G.cfg;
    // remote rematch: the initiator moves first, so their seat must be index 0
    const players = (App.mode === "remote" && App.mySeat === 1)
      ? [base.players[1], base.players[0]] : base.players;
    clearSave(); hideModal();
    startGame({...base, players, seed:newSeed()}, App.mode === "remote" ? 0 : null);
  });
}

/* ---------- remote play by code ---------- */
function packHistory(h){
  return h.map(a => a.k === "p" ? [a.t, a.a[0], a.a[1], a.b[0], a.b[1], a.fa?1:0] : ["s", a.yes?1:0]);
}
function unpackAct(e){
  return e[0] === "s" ? {k:"s", yes:!!e[1]}
                      : {k:"p", t:e[0], a:[e[1],e[2]], b:[e[3],e[4]], fa:e[5]};
}
function b64u(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }

function gameData(){
  const G = App.G;
  const d = {v:1, mode:App.mode, s:G.cfg.seed,
    p:G.cfg.players.map(x=>({t:x.type==="ai"?1:0, n:x.name, d:x.diff||0})),
    h:packHistory(G.history)};
  if (App.mode === "remote" && App.mySeat != null) d.a = App.mySeat; // author's seat
  return d;
}
function encodeGame(){ return "ING1." + b64u(JSON.stringify(gameData())); }
function shareLink(code){
  return location.href.split("#")[0] + "#g=" + code;
}
function copyText(text, btn){
  const done = ok => { if (btn){ const t = btn.textContent; btn.textContent = ok ? "Copied!" : "Copy failed"; setTimeout(()=>btn.textContent = t, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
  else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); done(ok);
  }
}

function showSendModal(final){
  const G = App.G;
  const code = encodeGame();
  App.lastCode = code;
  const opp = App.mySeat != null ? pName(1 - App.mySeat) : "your opponent";

    <p style="text-align:center">Send this ${final ? "result" : "code"} to <b>${opp}</b> &mdash; any messaging app works. ${final ? "" : "They paste it into <b>Enter a move code</b> and play their turn."}</p>
    <textarea readonly id="m-code">${code}</textarea>
    <div class="btnrow">
      <button class="btn primary" id="m-copy">Copy code</button>

function showJoinModal(){
  showModal(`<h3>Enter move code</h3>
    <p>Paste the code or link a friend sent you. The game continues exactly where they left it.</p>
    <textarea id="m-in" placeholder="ING1.&hellip;" autocomplete="off" spellcheck="false"></textarea>
    <p class="codebox-note" id="m-err" style="color:var(--danger)"></p>
    <div class="btnrow">
      <button class="btn quiet" id="m-cancel">Cancel</button>
      <button class="btn primary" id="m-go">Continue game</button></div>`);
  $("m-in").focus();
  $("m-cancel").addEventListener("click", hideModal);

    else if (!ok)
      $("m-err").textContent = "That doesn't look like a valid Ingenious code.";
  });
}

function importCode(str){
  const m = String(str).match(/ING1\.([A-Za-z0-9_\-]+)/);
  if (!m) return false;
  let data;
  try { data = JSON.parse(unb64u(m[1])); } catch(e){ return false; }
  if (!data || data.v !== 1 || !Array.isArray(data.h) || typeof data.s !== "number") return false;
  const np = Array.isArray(data.p) ? data.p.length : 0;
  if (!{local:1, remote:1, solitaire:1}[data.mode] || np < 1 || np > 4 ||
      (data.mode === "remote" && np !== 2) || (data.mode === "solitaire" && np !== 1)) return false;
  // never silently rewind: an older code for the game we already have goes further back
  const saved = loadSave();
  if (saved && saved.s === data.s && Array.isArray(saved.h) && saved.h.length > data.h.length)
    return "stale";
  let G;
  try { G = loadGameFromData(data); } catch(e){ console.error(e); return false; }
  App.G = G;
  App.mode = data.mode;
  App.bonusActive = false;
  App.revealedFor = null;
  clearSelection(); App.anchors = null;
  // which seat does this device control?
  if (data.mode === "remote"){
    const lk = "ing.seat." + data.s;
    const stored = localStorage.getItem(lk);
    if (stored != null) App.mySeat = +stored;
    else {
      // a code is normally opened by the author's opponent
      App.mySeat = data.a != null ? 1 - data.a : (G.expect === "over" ? 1 : G.cur);
      try{ localStorage.setItem(lk, App.mySeat); }catch(e){}
    }
  } else App.mySeat = null;
  hideModal();
  try { enterGameScreen(); } catch(e){ console.error(e); return false; }
  persist(); // only after the game rendered successfully
  return true;
}

function loadGameFromData(data){
  const cfg = {mode:data.mode, seed:data.s,
    players:data.p.map(x=>({type:x.t ? "ai" : "human", name:String(x.n).slice(0,24), diff:x.d}))};
  const G = newGame(cfg);
  for (const e of data.h) applyAction(G, unpackAct(e));
  return G;
}

/* ---------- persistence ---------- */
const SAVE_KEY = "ing.save.v1";
function persist(){
  if (!App.G) return;
  try {
    const d = gameData();
    d.seat = App.mySeat;
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  } catch(e){}
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

/* =====================================================================
   Screens: home & setup
   ===================================================================== */
const AI_NAMES = ["Juno", "Rex", "Vega", "Milo"];
function newSeed(){ return (Math.random() * 0x7fffffff) | 0; }

function goHome(){
  App.gen++;
  hideModal();
  showScreen("home");
  updateResumeCard();
}
function updateResumeCard(){
  const d = loadSave();
  const card = $("card-resume");
  if (!d){ card.style.display = "none"; return; }
  card.style.display = "";
  const who = d.mode === "solitaire" ? "solitaire"
    : d.p.map(x=>escapeHtml(x.n)).join(" · ");
  $("resume-desc").innerHTML = who + " &mdash; " + d.h.length + " move" + (d.h.length===1?"":"s") + " in";
}

function enterGameScreen(){
  showScreen("game");
  buildBoard(App.G);
  refreshBoardUI();
  pump();
}
function startGame(cfg, mySeat){
  App.G = newGame(cfg);
  App.mode = cfg.mode;
  App.mySeat = mySeat;
  App.bonusActive = false;
  App.revealedFor = null;
  clearSelection(); App.anchors = null;
  if (cfg.mode === "remote" && mySeat != null)
    try{ localStorage.setItem("ing.seat." + cfg.seed, mySeat); }catch(e){}
  persist();
  enterGameScreen();
}

/* ---------- setup screen ---------- */
function openSetup(go){
  App.setup = {go, count:2, diff:1, seats:[]};
  const titles = {local:"Local game", solitaire:"Solitaire", remote:"Play by link"};
  $("setup-title").textContent = titles[go];
  $("field-count").style.display = go === "local" ? "" : "none";
  $("seats-label").textContent = go === "remote" ? "Players (you first)" : go === "solitaire" ? "Your name" : "Seats";
  $("setup-hint").innerHTML = go === "solitaire"
    ? "Small board, double-length tracks (0&ndash;36), no bonus plays. Your weakest color is your score."
    : go === "remote"
      ? "You play first. After each of your turns you&rsquo;ll get a code to send &mdash; your friend pastes it on their device."
      : "Mix humans and AI freely. Racks stay hidden with a pass-the-device screen.";
  const n = go === "solitaire" ? 1 : 2;
  App.setup.count = n;
  App.setup.seats = [];
  for (let i = 0; i < 4; i++){
    App.setup.seats.push({
      type: go === "local" && i > 0 ? "ai" : "human",
      name: null, // null = auto default
    });
  }
  renderSeats();
  renderSegs();
  showScreen("setup");
}
function seatDefaultName(i){
  const s = App.setup.seats[i];
  if (App.setup.go === "remote") return i === 0 ? "You" : "Friend";
  return s.type === "ai" ? AI_NAMES[i] : "Player " + (i+1);
}
function seatName(i){
  const s = App.setup.seats[i];
  return (s.name && s.name.trim()) ? s.name.trim().slice(0,24) : seatDefaultName(i);
}
function renderSeats(){
  const box = $("seats");
  box.innerHTML = "";
  const go = App.setup.go;
  for (let i = 0; i < App.setup.count; i++){
    const s = App.setup.seats[i];
    const row = document.createElement("div");
    row.className = "seat";
    const showToggle = go === "local";
    row.innerHTML = `<input type="text" maxlength="24" placeholder="${escapeHtml(seatDefaultName(i))}"
        value="${s.name ? escapeHtml(s.name) : ""}" aria-label="player ${i+1} name">
      ${showToggle ? `<div class="seg">
        <button class="${s.type==="human"?"on":""}" data-t="human">Human</button>
        <button class="${s.type==="ai"?"on":""}" data-t="ai">AI</button></div>` : ""}`;
    row.querySelector("input").addEventListener("input", e => { s.name = e.target.value; });
    if (showToggle) row.querySelectorAll(".seg button").forEach(b =>
      b.addEventListener("click", ()=>{ s.type = b.dataset.t; renderSeats(); updateDiffVis(); }));
    box.appendChild(row);
  }
  updateDiffVis();
}
function updateDiffVis(){
  const anyAI = App.setup.go === "local" &&
    App.setup.seats.slice(0, App.setup.count).some(s=>s.type==="ai");
  $("field-diff").style.display = anyAI ? "" : "none";
}
function renderSegs(){
  document.querySelectorAll("#seg-count button").forEach(b =>
    b.classList.toggle("on", +b.dataset.n === App.setup.count));
  document.querySelectorAll("#seg-diff button").forEach(b =>
    b.classList.toggle("on", +b.dataset.d === App.setup.diff));
}
function setupStart(){
  const st = App.setup;
  if (st.go === "solitaire"){
    startGame({mode:"solitaire", seed:newSeed(),
      players:[{type:"human", name:seatName(0)}]}, null);
    return;
  }
  const players = [];
  for (let i = 0; i < st.count; i++){
    const s = st.seats[i];
    players.push({type: st.go === "remote" ? "human" : s.type, name: seatName(i),
      diff: s.type === "ai" ? st.diff : 0});
  }
  if (st.go === "remote"){
    startGame({mode:"remote", seed:newSeed(), players}, 0);
  } else {
    startGame({mode:"local", seed:newSeed(), players}, null);
  }
}

/* ---------- rules ---------- */
function showRules(){
  showModal(`<h3>How to play</h3><div class="rules-body">
    <p><b>Goal:</b> build lines of matching symbols. Your final score is your <b>weakest</b> color &mdash; keep all six moving.</p>
    <h4>On your turn</h4>
    <ul>
      <li>Place one tile from your rack on any two empty neighbouring cells.</li>
      <li><b>First round only:</b> your first tile must touch one of the six printed start symbols that no one has used yet.</li>
      <li>Each half of the tile scores: from that symbol, 5 lines radiate outward (not through the tile&rsquo;s other half). Count every matching symbol in each line until a gap or a different symbol. Advance that color&rsquo;s track.</li>
    </ul>
    <h4>Ingenious!</h4>
    <p>A track stops at 18. The moment one <b>reaches 18</b> you shout &ldquo;Ingenious!&rdquo; and immediately play a bonus tile &mdash; before drawing back up.</p>
    <h4>Swap</h4>
    <p>After playing, if you hold <b>no tiles of your weakest color</b>, you may swap your whole rack before drawing.</p>
    <h4>Game end</h4>
    <p>When no tile fits anywhere, compare everyone&rsquo;s weakest color; ties compare the next weakest. Maxing all six tracks wins instantly.</p>
    <h4>Boards &amp; variants</h4>
    <p>2 players use the small board, 3 the middle ring, 4 the whole board. Solitaire uses the small board with 0&ndash;36 tracks, one tile at a time, no bonus plays.</p>
    </div>
    <div class="btnrow"><button class="btn primary" id="m-ok">Close</button></div>`);
  $("m-ok").addEventListener("click", hideModal);
}

/* =====================================================================
   Init
   ===================================================================== */
function init(){
  // global symbol defs (referenced by board, rack and logo via #symN)
  const hidden = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  hidden.setAttribute("width", "0"); hidden.setAttribute("height", "0");
  hidden.style.position = "absolute";
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  hidden.appendChild(defs);
  symbolDefs(defs);
  document.body.insertBefore(hidden, document.body.firstChild);

  // logo row
  $("logo-hexrow").innerHTML = COLORS.map((c,i)=>
    `<svg width="30" height="32" viewBox="-11 -11 22 22">
      <polygon points="${hexPts(0,0,10)}" fill="var(--surface)" stroke="${c.fill}" stroke-width="1.2"/>
      <use href="#sym${i}" transform="scale(.92)"/></svg>`).join("");

  document.querySelectorAll(".mode-card[data-go]").forEach(b =>
    b.addEventListener("click", ()=>{
      const go = b.dataset.go;
      if (go === "join") showJoinModal();
      else openSetup(go);
    }));
  $("card-resume").addEventListener("click", ()=>{
    const d = loadSave();
    if (!d){ updateResumeCard(); return; }
    let G;
    try { G = loadGameFromData(d); }
    catch(e){ console.error(e); clearSave(); updateResumeCard(); return; }
    App.G = G; App.mode = d.mode; App.mySeat = d.seat != null ? d.seat : null;
    App.bonusActive = false; App.revealedFor = null;
    clearSelection(); App.anchors = null;
    enterGameScreen();
  });
  $("btn-rules-home").addEventListener("click", showRules);
  $("btn-rules-game").addEventListener("click", showRules);
  $("btn-home").addEventListener("click", goHome);
  $("btn-setup-back").addEventListener("click", goHome);
  $("btn-start").addEventListener("click", setupStart);
  document.querySelectorAll("#seg-count button").forEach(b =>
    b.addEventListener("click", ()=>{ App.setup.count = +b.dataset.n; renderSegs(); renderSeats(); }));
  document.querySelectorAll("#seg-diff button").forEach(b =>
    b.addEventListener("click", ()=>{ App.setup.diff = +b.dataset.d; renderSegs(); }));
  overlay.addEventListener("click", e => {
    // only dismissible modals close on backdrop tap; keep it strict: never auto-close
    if (e.target === overlay) e.stopPropagation();
  });

  // scores strip: above the board on small screens, sidebar on wide ones
  const mq = window.matchMedia("(min-width: 920px)");
  const placeScores = ()=>{
    const sc = $("scores");
    if (mq.matches) $("gside").appendChild(sc);
    else $("gmain").insertBefore(sc, $("boardwrap"));
  };
  if (mq.addEventListener) mq.addEventListener("change", placeScores);
  else if (mq.addListener) mq.addListener(placeScores);
  placeScores();

  // arriving via a shared link?
  const hash = location.hash || "";
  if (/ING1\./.test(hash)){
    const m = hash.match(/ING1\.([A-Za-z0-9_\-]+)/);
    let incoming = null;
    try { incoming = JSON.parse(unb64u(m[1])); } catch(e){}
    const saved = loadSave();
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    // if we already have an equal-or-longer local history of the same game, resume it
    if (incoming && saved && saved.s === incoming.s && saved.h.length >= incoming.h.length){
      updateResumeCard();
      $("card-resume").click();
      return;
    }
    if (incoming && importCode("ING1." + m[1]) === true) return;
  }
  updateResumeCard();
}
init();
</script>
