<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid Viewer - Jaron Wilson</title>
<meta name="description" content="Paste Mermaid code, see the diagram live. Runs entirely in your browser.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#faf8f4; --surface:#ffffff; --ink:#1a1a17; --muted:#6b6862; --border:#e8e4dc; --accent:#b3542b; --accent-ink:#fff; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#17150f; --surface:#201d16; --ink:#ede9e0; --muted:#a39d8f; --border:#35322a; --accent:#d97a4a; --accent-ink:#17150f; --bad:#f2786b; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  header a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
  header h1 { font-family: Fraunces, Georgia, serif; font-size: 22px; margin: 0; }
  header .sp { flex: 1; }
  select, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:hover, select:hover { border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: minmax(280px, 40%) 1fr; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .plabel { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 14px 4px; display: flex; justify-content: space-between; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 10px 14px 14px; background: var(--surface); color: var(--ink); font: 14px/1.55 "JetBrains Mono", ui-monospace, monospace; tab-size: 2; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  #view { flex: 1; overflow: auto; padding: 18px; display: flex; align-items: flex-start; justify-content: center; background: var(--surface); }
  #view svg { max-width: 100%; height: auto; }
  #view.zoom svg { max-width: none; }
  #err { color: var(--bad); font: 13px/1.4 "JetBrains Mono", monospace; padding: 0 14px 8px; white-space: pre-wrap; min-height: 0; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; display: none; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } .pane + .pane { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <a class="back" href="/">&larr; jaronwilson.dev</a>
  <h1>Mermaid Viewer</h1>
  <span class="sp"></span>
  <select id="example" aria-label="Load an example">
    <option value="">Examples...</option>
    <option value="flow">Flowchart (top to bottom)</option>
    <option value="seq">Sequence diagram</option>
    <option value="state">State diagram</option>
    <option value="gantt">Gantt chart</option>
    <option value="er">Entity relationship</option>
    <option value="pie">Pie chart</option>
    <option value="mind">Mind map</option>
  </select>
  <select id="theme" aria-label="Diagram theme">
    <option value="auto">Theme: match page</option>
    <option value="neutral">Neutral</option>
    <option value="default">Default</option>
    <option value="forest">Forest</option>
    <option value="dark">Dark</option>
  </select>
  <button id="zoom" title="Toggle fit to width / actual size">Fit</button>
  <button id="share" title="Copy a link that contains this diagram">Copy link</button>
  <button id="svg">SVG</button>
  <button id="png" class="primary">PNG</button>
</header>
<main>
  <section class="pane">
    <div class="plabel"><span>Mermaid code</span><span id="saved"></span></div>
    <textarea id="code" spellcheck="false" aria-label="Mermaid code"></textarea>
    <div id="err" role="status" aria-live="polite"></div>
  </section>
  <section class="pane">
    <div class="plabel"><span>Diagram</span><span>Runs in your browser; nothing is uploaded</span></div>
    <div id="view"></div>
  </section>
</main>
<div id="toast"></div>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const EX = {
    flow: `flowchart TB
  A[Request] --> B{Valid?}
  B -->|yes| C[Process]
  B -->|no| D[Reject]
  C --> E[Done]`,
    seq: `sequenceDiagram
  participant U as User
  participant S as Server
  participant M as Model
  U->>S: request
  S->>M: step
  M-->>S: tokens
  S-->>U: answer`,
    state: `stateDiagram-v2
  [*] --> Idle
  Idle --> Running: start
  Running --> Paused: pause
  Paused --> Running: resume
  Running --> [*]: finish`,
    gantt: `gantt
  title Project plan
  dateFormat YYYY-MM-DD
  section Build
  Design     :a1, 2026-11-24, 3d
  Prototype  :a2, after a1, 5d
  section Test
  Load test  :after a2, 2d`,
    er: `erDiagram
  USER ||--o{ TOKEN : has
  TOKEN ||--o{ REQUEST : makes
  USER { string name }
  REQUEST { int tokens }`,
    pie: `pie title Where the time goes
  "Training" : 45
  "Evaluation" : 25
  "Data prep" : 30`,
    mind: `mindmap
  root((Car project))
    Cameras
      Front mount
      Rear mount
    Data
      CAN
      GPS
    Views
      Classic
      Reality`
  };
  const $ = (s) => document.querySelector(s);
  const code = $("#code"), view = $("#view"), err = $("#err"), theme = $("#theme");
  const darkQ = window.matchMedia("(prefers-color-scheme: dark)");
  let n = 0, timer = null, lastSvg = "";

  function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = "none", 2200); }
  function themeName() { return theme.value === "auto" ? (darkQ.matches ? "dark" : "neutral") : theme.value; }
  function b64e(s) { return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }

  async function render() {
    const src = code.value;
    localStorage.setItem("mermaid-viewer", src);
    $("#saved").textContent = "saved in this browser";
    if (!src.trim()) { view.innerHTML = ""; err.textContent = ""; lastSvg = ""; return; }
    mermaid.initialize({ startOnLoad: false, theme: themeName(), securityLevel: "strict", flowchart: { curve: "basis" } });
    try {
      await mermaid.parse(src);
      const { svg } = await mermaid.render("m" + (++n), src);
      view.innerHTML = svg; lastSvg = svg; err.textContent = "";
    } catch (e) {
      err.textContent = String(e && e.message ? e.message : e).split("\n").slice(0, 6).join("\n");
      document.querySelectorAll("[id^='dm'], #d" + "m" + n).forEach(x => x.remove());
    }
  }
  function soon() { clearTimeout(timer); timer = setTimeout(render, 300); }

  code.addEventListener("input", soon);
  code.addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); const s = code.selectionStart; code.setRangeText("  ", s, code.selectionEnd, "end"); soon(); }
  });
  $("#example").addEventListener("change", (e) => { if (EX[e.target.value]) { code.value = EX[e.target.value]; render(); } e.target.value = ""; });
  theme.addEventListener("change", render);
  darkQ.addEventListener("change", () => { if (theme.value === "auto") render(); });
  $("#zoom").addEventListener("click", () => { view.classList.toggle("zoom"); $("#zoom").textContent = view.classList.contains("zoom") ? "Actual" : "Fit"; });
  $("#share").addEventListener("click", async () => {
    const url = location.origin + location.pathname + "#code=" + b64e(code.value);
    history.replaceState(null, "", url);
    try { await navigator.clipboard.writeText(url); toast("Link copied (the diagram lives in the link)"); } catch { toast("Link is in the address bar"); }
  });
  function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  $("#svg").addEventListener("click", () => { if (!lastSvg) return toast("Nothing to save yet"); download("diagram.svg", new Blob([lastSvg], { type: "image/svg+xml" })); });
  $("#png").addEventListener("click", () => {
    const svgEl = view.querySelector("svg"); if (!svgEl) return toast("Nothing to save yet");
    const box = svgEl.getBBox ? svgEl.viewBox.baseVal : null;
    const w = Math.ceil((box && box.width) || svgEl.getBoundingClientRect().width), h = Math.ceil((box && box.height) || svgEl.getBoundingClientRect().height);
    const scale = 2, clone = svgEl.cloneNode(true);
    clone.setAttribute("width", w); clone.setAttribute("height", h);
    const data = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w * scale; c.height = h * scale;
      const ctx = c.getContext("2d"); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#fff";
      ctx.fillRect(0, 0, c.width, c.height); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, w, h);
      c.toBlob((b) => download("diagram.png", b), "image/png");
    };
    img.onerror = () => toast("PNG export failed in this browser; use SVG");
    img.src = data;
  });

  const m = location.hash.match(/code=([^&]+)/);
  let start = EX.flow;
  if (m) { try { start = b64d(m[1]); } catch {} }
  else if (localStorage.getItem("mermaid-viewer")) start = localStorage.getItem("mermaid-viewer");
  code.value = start;
  render();
</script>
</body>
</html>
