<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Roulette Wheel with Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Added Showdown.js for Markdown rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1a202c; /* Equivalent to bg-gray-900 */
        }
        canvas {
            transition: transform 10s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .result-modal {
            transition: opacity 0.3s ease-in-out;
        }
        .filter-btn {
            background-color: #4a5568; /* gray-600 */
            color: #e2e8f0; /* gray-300 */
            transition: background-color 0.2s, color 0.2s;
        }
        .filter-btn.active {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            font-weight: 600;
        }
        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #4f46e5; /* Indigo */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Styling for rendered markdown */
        #geminiResponse strong {
            color: #a5b4fc; /* indigo-300 */
        }
        #geminiResponse ol {
            list-style-position: inside;
            padding-left: 0.5rem;
        }
         #geminiResponse li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-4">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Game Roulette</h1>
        <p class="text-lg text-gray-400">Let AI help you decide what to play!</p>
    </div>

    <!-- Import Games Panel -->
    <div class="w-full max-w-2xl p-4 bg-gray-800 rounded-lg mb-6 shadow-lg">
        <h2 class="text-lg font-semibold text-center mb-3 text-indigo-300">Import Your Steam Library</h2>
        <p class="text-sm text-gray-400 text-center mb-3">
            Go to <a href="https://store.steampowered.com/account/licenses/" target="_blank" class="text-teal-400 hover:underline">your Steam licenses page</a>, copy the entire list (Ctrl+A, Ctrl+C), and paste it below.
        </p>
        <textarea id="steamListInput" rows="4" class="w-full p-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Paste your game list here..."></textarea>
        <div class="flex flex-col sm:flex-row gap-4 mt-3">
             <button id="processListBtn" class="w-full sm:w-1/2 px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Process Pasted List</button>
             <button id="categorizeBtn" class="w-full sm:w-1/2 px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-colors" disabled>✨ Categorize with AI</button>
        </div>
        <p id="processStatus" class="text-center text-sm text-green-400 mt-2 h-4"></p>
    </div>

    <!-- AI Settings Panel -->
    <div class="w-full max-w-2xl p-4 bg-gray-800 rounded-lg mb-6 shadow-lg">
        <h2 class="text-lg font-semibold text-center mb-3 text-indigo-300">AI Settings</h2>
        <div class="flex flex-col sm:flex-row gap-4 items-end">
            <div class="w-full sm:flex-grow">
                <label for="apiKeyInput" class="text-sm font-medium text-gray-400">Your Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Enter API key to use AI features" class="w-full p-2 mt-1 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="w-full sm:w-auto">
                <label for="modelSelector" class="text-sm font-medium text-gray-400">Model</label>
                <select id="modelSelector" class="w-full p-2 mt-1 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash-lite-preview-06-17">Flash Lite (Preview)</option>
                    <option value="gemma-3n-e2b-it">Gemma 3</option>
                </select>
            </div>
            <button id="saveSettingsBtn" class="w-full sm:w-auto px-4 py-2 bg-teal-600 text-white font-semibold rounded-lg hover:bg-teal-700 transition-colors flex-shrink-0">Save Settings</button>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div id="filterContainer" class="flex flex-wrap justify-center gap-2 mb-4">
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base active" data-filter="all">All</button>
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base" data-filter="1">1 Player</button>
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base" data-filter="2">2 Players</button>
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base" data-filter="3">3 Players</button>
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base" data-filter="4">4 Players</button>
        <button class="filter-btn px-4 py-2 rounded-md text-sm sm:text-base" data-filter="5">5+ Players</button>
    </div>

    <!-- Roulette Wheel Container -->
    <div class="wheel-container relative w-[320px] h-[320px] sm:w-[400px] sm:h-[400px] md:w-[500px] md:h-[500px] flex items-center justify-center">
        <div class="absolute top-[-15px] left-1/2 -translate-x-1/2 z-20">
            <div class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[30px] border-t-red-500"></div>
        </div>
        <canvas id="wheel" width="500" height="500" class="rounded-full shadow-2xl"></canvas>
    </div>

    <!-- Spin Button -->
    <button id="spinBtn" class="mt-8 px-12 py-4 bg-indigo-600 text-white font-bold text-xl rounded-lg shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-indigo-500 disabled:bg-gray-500 disabled:cursor-not-allowed">
        SPIN
    </button>
    
    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none">
        <div class="bg-gray-800 rounded-2xl shadow-2xl text-center p-6 sm:p-8 max-w-lg w-full transform scale-95 transition-transform duration-300 ease-out">
            <h2 class="text-2xl font-bold text-gray-300 mb-2">The wheel has chosen...</h2>
            <p id="resultText" class="text-4xl font-bold text-indigo-400 my-4"></p>
            
            <div id="geminiFeaturesContainer" class="flex flex-col sm:flex-row gap-3 justify-center mt-4">
                <button id="whyPlayBtn" class="px-4 py-2 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors">✨ Why should I play this?</button>
                <button id="challengeBtn" class="px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-colors">✨ Give me a challenge</button>
                <button id="suggestBtn" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">✨ Suggest a Similar Game</button>
            </div>

            <div id="geminiResponseContainer" class="mt-4 text-left bg-gray-700 p-4 rounded-lg hidden overflow-y-auto max-h-64">
                 <div id="loader" class="loader hidden"></div>
                 <div id="geminiResponse" class="text-gray-300 whitespace-pre-wrap"></div>
            </div>

            <button id="closeModalBtn" class="mt-6 px-8 py-2 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition-colors">
                Close
            </button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinBtn');
            const resultModal = document.getElementById('resultModal');
            const resultText = document.getElementById('resultText');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const filterContainer = document.getElementById('filterContainer');
            const whyPlayBtn = document.getElementById('whyPlayBtn');
            const challengeBtn = document.getElementById('challengeBtn');
            const suggestBtn = document.getElementById('suggestBtn');
            const geminiResponseContainer = document.getElementById('geminiResponseContainer');
            const geminiResponseEl = document.getElementById('geminiResponse');
            const loader = document.getElementById('loader');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const modelSelector = document.getElementById('modelSelector');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const steamListInput = document.getElementById('steamListInput');
            const processListBtn = document.getElementById('processListBtn');
            const categorizeBtn = document.getElementById('categorizeBtn');
            const processStatus = document.getElementById('processStatus');

            // --- Game Data ---
            let allGames = [];
            let tempParsedGames = []; // Store un-categorized games

            const defaultGames = [
                { name: "Enshrouded", players: 5 }, { name: "Abiotic Factor", players: 5 }, { name: "Planet Coaster", players: 1 }, 
                { name: "Super WorldBox", players: 1 }, { name: "Buckshot Roulette", players: 1 }, { name: "FTL: Faster Than Light", players: 1 }, 
                { name: "Hacknet", players: 1 }, { name: "Friends vs Friends", players: 4 }, { name: "Among Us", players: 5 }, 
                { name: "Content Warning", players: 4 }, { name: "Scrap Mechanic", players: 5 }, { name: "Rainbow Six Siege", players: 5 }
            ];

            let currentGames = [];
            let selectedGameName = '';
            
            const colors = [ "#4f46e5", "#6366f1", "#818cf8", "#a5b4fc", "#c7d2fe", "#16a34a", "#22c55e", "#4ade80", "#86efac", "#bbf7d0", "#d97706", "#f59e0b", "#facc15", "#fde047", "#fef08a"];

            let currentRotation = 0;
            let isSpinning = false;
            
            // --- Gemini API & Markdown ---
            const markdownConverter = new showdown.Converter(); 

            async function callGemini(prompt, isCategorization = false) {
                const apiKey = apiKeyInput.value;
                const model = modelSelector.value;
                
                if (!apiKey) {
                    const statusEl = isCategorization ? processStatus : geminiResponseEl;
                    const containerEl = isCategorization ? null : geminiResponseContainer;
                    if(containerEl) containerEl.style.display = 'block';
                    statusEl.innerHTML = `<p class="text-red-400 font-semibold">Please enter your Gemini API key in the AI Settings section to use this feature.</p>`;
                    if(!isCategorization) loader.style.display = 'none';
                    return null;
                }

                if (!isCategorization) {
                    geminiResponseContainer.style.display = 'block';
                    geminiResponseEl.style.display = 'none';
                    loader.style.display = 'block';
                } else {
                    processStatus.textContent = 'AI is categorizing, please wait...';
                    categorizeBtn.disabled = true;
                }

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                
                const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };

                if(isCategorization) {
                    payload.generationConfig = {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    "name": { "type": "STRING" },
                                    "players": { "type": "NUMBER" }
                                },
                                required: ["name", "players"]
                            }
                        }
                    }
                }

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`API call failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0) {
                        const text = result.candidates[0].content.parts[0].text;
                        if(isCategorization) {
                            return JSON.parse(text);
                        } else {
                            geminiResponseEl.innerHTML = markdownConverter.makeHtml(text);
                        }
                    } else {
                         throw new Error("No candidates returned from API.");
                    }

                } catch (error) {
                    console.error("Gemini API call error:", error);
                     if (isCategorization) {
                        processStatus.textContent = 'AI categorization failed. Check console.';
                    } else {
                        geminiResponseEl.textContent = 'An error occurred while contacting the AI. Check the console for details.';
                    }
                    return null;
                } finally {
                    if (!isCategorization) {
                        loader.style.display = 'none';
                        geminiResponseEl.style.display = 'block';
                    }
                    categorizeBtn.disabled = false;
                }
            }
            
            // --- Game List Management ---
            function parseSteamList() {
                const rawText = steamListInput.value;
                if (!rawText) return;

                const lines = rawText.split('\n');
                const acquisitionMethods = ["Steam Store", "Complimentary", "Gift/Guest Pass", "Retail"];
                const junkKeywords = ["Demo", "Soundtrack", "Playtest", "Pack", "DLC", "Bundle-only", "Texture", "Beta", "Test", "Server"];

                const gameTitles = lines.map(line => {
                    let cleanedLine = line.trim().replace(/^[A-Za-z]{3}\s\d{1,2},\s\d{4}/, '').replace(/^Remove/, '');
                    acquisitionMethods.forEach(method => {
                        if (cleanedLine.endsWith(method)) {
                            cleanedLine = cleanedLine.slice(0, -method.length);
                        }
                    });
                    return cleanedLine.trim();
                }).filter(title => {
                    return title && !junkKeywords.some(keyword => title.toLowerCase().includes(keyword.toLowerCase()));
                });

                tempParsedGames = [...new Set(gameTitles)]; // Remove duplicates
                processStatus.textContent = `Found ${tempParsedGames.length} unique games! Ready to be categorized by AI.`;
                categorizeBtn.disabled = false;
            }
            
            async function categorizeWithAI() {
                if(tempParsedGames.length === 0) {
                    processStatus.textContent = 'Please process a list first.';
                    return;
                }

                const prompt = `You are an expert in video games. I will provide you with a JSON array of game titles. Your task is to determine the maximum player count for each game and categorize it. The categories are: 1, 2, 3, 4, or 5 (for 5 or more players). For single-player only games, use 1. For games with local or online co-op/multiplayer, use the max player count. Please respond with a JSON array of objects, where each object has a "name" (the original game title) and a "players" (the category number). Here is the list of games: ${JSON.stringify(tempParsedGames)}`;

                const categorizedGames = await callGemini(prompt, true);
                
                if (categorizedGames && categorizedGames.length > 0) {
                    allGames = categorizedGames;
                    localStorage.setItem('userGameList', JSON.stringify(allGames));
                    processStatus.textContent = `Successfully categorized ${allGames.length} games!`;
                    steamListInput.value = '';
                    updateGameListAndWheel();
                } else {
                    processStatus.textContent = 'AI categorization failed. Using default list.';
                }
            }

            function updateGameListAndWheel(filter = 'all') {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');

                if (filter === 'all') {
                    currentGames = [...allGames];
                } else {
                    const playerCount = parseInt(filter, 10);
                    currentGames = allGames.filter(game => playerCount < 5 ? game.players === playerCount : game.players >= 5);
                }
                
                currentRotation = 0;
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(0deg)`;
                setCanvasSize();
            }

            // --- Wheel Drawing and Spinning ---
            function drawWheel(size) {
                const numSegments = currentGames.length;
                if (numSegments === 0) {
                    ctx.clearRect(0, 0, size, size);
                    ctx.fillStyle = "white";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.font = `bold ${size * 0.08}px Poppins`;
                    ctx.fillText("No Games Found", size / 2, size / 2);
                    spinBtn.disabled = true;
                    return;
                }
                spinBtn.disabled = false;

                const arcSize = 2 * Math.PI / numSegments;
                const radius = size / 2;
                ctx.clearRect(0, 0, size, size); 
                ctx.strokeStyle = '#1a202c'; 
                ctx.lineWidth = 3;
                ctx.save();
                ctx.translate(radius, radius); 

                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arcSize;
                    ctx.fillStyle = colors[i % colors.length];

                    ctx.beginPath();
                    ctx.arc(0, 0, radius - 5, angle, angle + arcSize, false);
                    ctx.arc(0, 0, radius * 0.2, angle + arcSize, angle, true);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.save();
                    ctx.fillStyle = "white";
                    ctx.translate(0, 0);
                    ctx.rotate(angle + arcSize / 2);
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    const fontSize = numSegments > 40 ? radius * 0.035 : (numSegments > 20 ? radius * 0.045 : radius * 0.06);
                    ctx.font = `bold ${fontSize}px Poppins`; 
                    const text = currentGames[i].name;
                    ctx.fillText(text, radius - 15, 0);
                    ctx.restore();
                }
                ctx.restore();
                
                ctx.fillStyle = '#4a5568';
                ctx.beginPath();
                ctx.arc(radius, radius, radius * 0.18, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#2d3748';
                ctx.beginPath();
                ctx.arc(radius, radius, radius * 0.12, 0, 2 * Math.PI);
                ctx.fill();
            }

            function spin() {
                if (isSpinning || currentGames.length === 0) return;
                isSpinning = true;
                spinBtn.disabled = true;

                const spinAngle = Math.random() * 360 + 360 * 7; 
                const totalRotation = currentRotation + spinAngle;
                
                canvas.style.transition = 'transform 8s cubic-bezier(0.15, 0.75, 0.35, 1)';
                canvas.style.transform = `rotate(${totalRotation}deg)`;

                setTimeout(() => {
                    const numSegments = currentGames.length;
                    const finalAngle = totalRotation % 360;
                    const degreesPerSegment = 360 / numSegments;
                    const winningAngle = (270 - finalAngle + 360) % 360;
                    const winningIndex = Math.floor(winningAngle / degreesPerSegment);
                    
                    showResult(currentGames[winningIndex].name);
                    
                    isSpinning = false;
                    spinBtn.disabled = false;
                    canvas.style.transition = 'none';
                    canvas.style.transform = `rotate(${finalAngle}deg)`;
                    currentRotation = finalAngle;

                }, 8000); 
            }
            
            // --- Event Listeners & Settings Management ---
            filterContainer.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON') return;
                updateGameListAndWheel(e.target.dataset.filter);
            });
            
            processListBtn.addEventListener('click', parseSteamList);
            categorizeBtn.addEventListener('click', categorizeWithAI);

            whyPlayBtn.addEventListener('click', () => {
                const prompt = `You are a helpful and enthusiastic gaming assistant. A user has just landed on the game "${selectedGameName}" on a roulette wheel. Give them a short, exciting, one-paragraph summary of why they should play it right now. Focus on the core fun factor and what makes it unique.`;
                callGemini(prompt);
            });

            challengeBtn.addEventListener('click', () => {
                const prompt = `You are a creative gaming assistant. For the video game "${selectedGameName}", generate 3 unique and fun gameplay challenges to make it more interesting. Present them as a simple numbered list with bold headings for each challenge. For example: **1. The Pacifist:** Try to win without...`;
                callGemini(prompt);
            });

            suggestBtn.addEventListener('click', () => {
                const ownedGamesList = allGames.map(g => g.name).join(', ');
                const prompt = `I own the following games: ${ownedGamesList}. The roulette wheel just selected "${selectedGameName}". Based on this, suggest one similar game that is NOT in my owned games list. Provide the suggested game's name in bold, followed by a one-paragraph reason why I would like it.`;
                callGemini(prompt);
            });

            function showResult(gameName) {
                selectedGameName = gameName;
                resultText.textContent = gameName;
                geminiResponseContainer.style.display = 'none'; 
                geminiResponseEl.innerHTML = '';
                resultModal.classList.remove('opacity-0', 'pointer-events-none');
                resultModal.querySelector('div').classList.remove('scale-95');
            }

            function hideResult() {
                resultModal.classList.add('opacity-0', 'pointer-events-none');
                 resultModal.querySelector('div').classList.add('scale-95');
            }

            function saveSettings() {
                localStorage.setItem('geminiApiKey', apiKeyInput.value);
                localStorage.setItem('geminiModel', modelSelector.value);
                
                saveSettingsBtn.textContent = 'Saved!';
                saveSettingsBtn.classList.remove('bg-teal-600', 'hover:bg-teal-700');
                saveSettingsBtn.classList.add('bg-green-600');
                
                setTimeout(() => {
                    saveSettingsBtn.textContent = 'Save Settings';
                    saveSettingsBtn.classList.remove('bg-green-600');
                    saveSettingsBtn.classList.add('bg-teal-600', 'hover:bg-teal-700');
                }, 2000);
            }

            function loadSettings() {
                const savedKey = localStorage.getItem('geminiApiKey');
                const savedModel = localStorage.getItem('geminiModel');
                if (savedKey) {
                    apiKeyInput.value = savedKey;
                }
                if (savedModel) {
                    modelSelector.value = savedModel;
                }
            }

            spinBtn.addEventListener('click', spin);
            closeModalBtn.addEventListener('click', hideResult);
            saveSettingsBtn.addEventListener('click', saveSettings);

            function setCanvasSize() {
                const container = document.querySelector('.wheel-container');
                let size = Math.min(500, window.innerWidth - 40, window.innerHeight * 0.6);
                size = Math.max(20, size); 

                container.style.width = `${size}px`;
                container.style.height = `${size}px`;
                
                const dpr = window.devicePixelRatio || 1;
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                ctx.scale(dpr, dpr);
                
                drawWheel(size);
            }
            
            window.addEventListener('resize', setCanvasSize);
            
            // --- Initial Setup ---
            const savedGames = localStorage.getItem('userGameList');
            if (savedGames) {
                allGames = JSON.parse(savedGames);
            } else {
                allGames = defaultGames;
            }
            loadSettings();
            updateGameListAndWheel();
        });
    </script>
</body>
</html>
